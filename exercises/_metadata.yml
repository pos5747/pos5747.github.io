# Settings shared by every wkNN-exercises.qmd in this folder.
#
# Keep the week files themselves down to a `title:`, a `distributed:` date,
# and the exercises.  Anything about formatting or release timing belongs
# here, or -- if one week needs to differ -- in that week's front matter,
# which overrides what is set below.

# --- when the complete solutions open ---------------------------------------
#
# Release moment = the week's `distributed:` date + solution-delay-days,
# at solution-unlock-time, America/New_York.  A set goes out Tuesday in
# class, so a three-day delay opens the solutions Friday at noon.  Week 1
# goes out Aug 25, so its solutions open Friday Aug 28 at 12:00 PM.
#
# Students get most of the week with the exercises and no answer key, and
# still have the weekend with the solutions before the next Tuesday's
# assessment, which draws on them.
#
# To shift every week, change the delay or the time here.  To shift one week,
# put the same key in that week's front matter, or pin the moment outright
# with `solution-unlock: "2026-08-28 12:00"`.

solution-delay-days: 3
solution-unlock-time: "12:00"

# browser = the text ships with the page and a script opens it on time, with
#           no second render.  The release is genuinely automatic: publish the
#           week once and the solutions appear Friday at noon whether or not
#           anyone runs `make site` that day.  The cost is that the solution
#           text is in the HTML from the moment the page goes up, so a student
#           who opens View Source can read it early.  That is the same trade
#           the always-open companion page already makes (the repo is public
#           and `wkNN-exercises-sol.html` is a guessable URL): what the gate
#           buys is that no student sees a live *Complete solution* button
#           before the release moment, not secrecy.
# render  = the solution text is absent from the page until you render after
#           the release moment; students cannot read ahead.  But nothing
#           happens on its own -- the page changes state only when someone
#           runs `make site` and pushes after the date.  This was the default
#           through Week 3, and it is why the Week 3 solutions did not open on
#           schedule: the render that would have opened them came days late.
#
# Changed to `browser` on 2026-09-14, from Week 4 on, so the release needs no
# render.  Weeks 1-3 are already past their release moment and are unaffected.
solution-gate: browser

# true  = show the hints that are written, and hide `::: {.hint .todo}`
#         placeholders entirely
# draft = also show the placeholders, marked "(draft)"
# false = no hint buttons at all
#
# Hints are being written one exercise at a time, so `draft` is the useful
# setting while that is in progress. Switch to `true` before publishing and
# the unwritten ones simply do not appear.
show-hints: draft

# --- formatting -------------------------------------------------------------

# Heading level that marks one exercise. Level-1 headings above it are topic
# sections. Numbering, #ex-N anchors, and the heading sizes all follow this.
exercise-level: 2


format:
  html:
    toc: true
    toc-depth: 2
    toc-title: Exercises
    number-sections: false
    css:
      - ../styles.css
      - exercises.css
    include-after-body:
      - _exercise-scripts.html

filters:
  - exercises.lua
  - quarto

# --- citations -------------------------------------------------------------
# A copy of ../../exercises/references.bib (the PDF sources cite with @key).
# Weeks that cite render a References section; weeks that do not are unaffected.
bibliography: references.bib
