project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!slides/"

execute:
  freeze: auto

website:
  title: "Modern Statistical Modeling"
  site-url: https://pos5747.github.io/
  google-analytics: "G-ZV1MJ9E632"
  navbar:
    left:
      - href: index.qmd
        text: Schedule
      - href: https://pos5747.github.io/notes/
        text: Notes
      - href: research-project.qmd
        text: Research Project
      - href: workshop.qmd
        text: Workshop
      - href: assessments.qmd
        text: Assessments
      - href: https://fsu.simplesyllabus.com/en-US/doc/vq5vl3ibt/2026-Fall-POS-5747-0001-Advanced-Quantitative-Analysis-in-Political-Science?mode=view
        text: Syllabus

format:
  html:
    theme:
      - sandstone
    css: styles.css
    toc: true
    
resources:
  - exr/
  - files/
  # slides/ is the working slide tree (Keynote sources + exported decks +
  # material folders). Only the exported artifacts are published; the
  # exclusions below keep sources, machinery, and unrevised decks off the
  # site. The entry MUST stay in glob form (slides/**): a bare directory
  # entry is copied wholesale and every "!" exclusion is silently ignored.
  - "slides/**"
  - "!slides/_src/**"
  - "!slides/README.md"
  - "!slides/CLAUDE.md"
  - "!slides/Makefile"
  - "!slides/future-slides/**"
  - "!slides/**/*.key"
  - "!slides/**/*-material/**"
  - "!slides/**/*-materials/**"
  - "!slides/**/.DS_Store"
  - "!slides/**/.stamp/**"
  - "!slides/**/.notes-audit/**"
  - data/



