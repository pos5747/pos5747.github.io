project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!slides/"
    # Week 1 ships as the PDF pair in exr/ (decided 2026-08-29). The HTML
    # rebuild stays as a source for reference but must not publish: it was
    # rendering into docs/exercises/ unlinked but discoverable, with its
    # solutions open because of the review-only solution-delay-days override.
    - "!exercises/wk01-exercises.qmd"

    # The per-week build directories (exercises/wkNN/) hold the pipeline's
    # working files: the spec, the findings, and the fragment .qmd files the
    # week's page is assembled from. "*.qmd" matches them recursively, and on
    # 2026-08-30 a render published all 25 wk03 fragments to
    # docs/exercises/wk03/fragments/ -- unlinked but discoverable, with every
    # solution open, because a fragment carries no `distributed:` date for the
    # solution gate to read.
    - "!exercises/wk*/"

    # exercises/parked/ holds good exercises cut from a live week for time,
    # kept verbatim for re-homing later (see exercises/README.md). Same hazard
    # as the fragments above: no `distributed:` date, so the solution gate
    # would leave every solution open on a discoverable page. Added 2026-09-01.
    - "!exercises/parked/"

    # 2026-09-05: the retired agent exercise pipeline (exercise-tools/, tools/,
    # parked/, wkNN/, agent-workflow.md) moved to -old/exercise-pipeline-2026-09-05/.
    # That archive still holds .qmd files (parked exercises, wk03 fragments)
    # with no `distributed:` date, so the solution gate would leave them open
    # if "*.qmd" reached them -- the same hazard the two exclusions above
    # guard against. The two exclusions above are now empty matches (nothing
    # left at those paths) and are kept, documented, and harmless.
    - "!-old/"

execute:
  freeze: auto

website:
  title: "Modern Statistical Modeling"
  site-url: https://pos5747.github.io/
  google-analytics: "G-ZV1MJ9E632"
  navbar:
    left:
      - href: index.qmd
        text: Schedule
      - href: https://pos5747.github.io/notes/
        text: Notes
      - href: research-project.qmd
        text: Research Project
      - href: workshop.qmd
        text: Workshop
      - href: assessments.qmd
        text: Assessments
      - href: https://fsu.simplesyllabus.com/en-US/doc/vq5vl3ibt/2026-Fall-POS-5747-0001-Advanced-Quantitative-Analysis-in-Political-Science?mode=view
        text: Syllabus

format:
  html:
    theme:
      - sandstone
    css: styles.css
    toc: true
    
resources:
  - exr/
  - files/
  # slides/ is the working slide tree (Keynote sources + exported decks +
  # material folders). Only the exported artifacts are published; the
  # exclusions below keep sources, machinery, and unrevised decks off the
  # site. The entry MUST stay in glob form (slides/**): a bare directory
  # entry is copied wholesale and every "!" exclusion is silently ignored.
  - "slides/**"
  - "!slides/_src/**"
  - "!slides/README.md"
  - "!slides/CLAUDE.md"
  - "!slides/Makefile"
  - "!slides/future-slides/**"
  - "!slides/**/*.key"
  - "!slides/**/*-material/**"
  - "!slides/**/*-materials/**"
  - "!slides/**/.DS_Store"
  - "!slides/**/.stamp/**"
  - "!slides/**/.notes-audit/**"
  # HTML (revealjs) decks live in their own folder, e.g. slides/wk06-ordered/,
  # a nested Quarto project rendered in place with `quarto render` there (the
  # site never renders slides/). Only the .html, its _files/, images/, and
  # styles.css publish; the source, cache, and project files stay home.
  # Added 2026-09-28.
  - "!slides/**/*.qmd"
  - "!slides/**/*_cache/**"
  - "!slides/**/_quarto.yml"
  - "!slides/**/*.bib"
  - "!slides/**/.quarto/**"
  - "!slides/**/.gitignore"
  - data/



